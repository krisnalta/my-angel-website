<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For My Angel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="message">
      To my sweetest Angel 💖,<br />
      I love you more than words can say.<br />
      With all my heart,<br />
      <br />
      Your boyfriend, Krisna 💫
    </div>
  </div>

  <!-- Floating Hearts -->
  <div class="hearts">
    <div class="heart" style="left: 10%; animation-delay: 0s;"></div>
    <div class="heart" style="left: 25%; animation-delay: 2s;"></div>
    <div class="heart" style="left: 40%; animation-delay: 4s;"></div>
    <div class="heart" style="left: 60%; animation-delay: 1s;"></div>
    <div class="heart" style="left: 80%; animation-delay: 3s;"></div>
  </div>

  <!-- Background Music -->
  <audio autoplay loop>
    <source src="assets/the-cutest-pair.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
</body>
</html>
